[project]
name = "django-project"
version = "0.1.0"
description = "Django project with Docker and CI/CD"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "django-environ>=0.11",
    "psycopg2-binary>=2.9",
    "gunicorn>=21.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[tool.uv]
package = false


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--cov",
    "--cov-report=term-missing",
]
